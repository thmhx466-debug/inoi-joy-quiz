<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>3連単予想クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#061F17;
    --bg2:#082A1F;
    --panel:#0C3527;
    --panel2:#0F4530;
    --line: rgba(198,255,77,0.18);
    --led:#C6FF4D;
    --led-dim:#7FCB2E;
    --gold:#FFC531;
    --white:#F3F3EC;
    --dim:#9FC9AE;
    --love:#FF4D6D;
    --me:#4DC3FF;
    --joy:#FFA23C;
    --danger:#FF4D6D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(198,255,77,0.08), transparent 55%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--white);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .disp{font-family:'Teko','Noto Sans JP',sans-serif; letter-spacing:0.02em;}

  #app{max-width:520px; margin:0 auto; padding:0 0 110px; position:relative;}

  /* ---- Header board ---- */
  .board-head{
    padding: calc(env(safe-area-inset-top) + 18px) 18px 14px;
    background:linear-gradient(180deg, var(--bg2), var(--bg) 90%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .board-head .kicker{
    font-size:11px; letter-spacing:0.35em; color:var(--led-dim); font-weight:700;
  }
  .board-head h1{
    font-family:'Teko'; font-weight:700; font-size:34px; line-height:1;
    margin:4px 0 0; color:var(--led);
    text-shadow:0 0 14px rgba(198,255,77,0.35);
  }
  .steps{display:flex; gap:6px; margin-top:12px;}
  .steps .dot{flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.1);}
  .steps .dot.on{background:var(--led); box-shadow:0 0 6px rgba(198,255,77,0.6);}

  .content{padding:18px;}

  /* ---- Generic panel ---- */
  .panel{
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel h2{
    font-family:'Teko'; font-size:22px; font-weight:600; margin:0 0 10px; color:var(--gold);
    display:flex; align-items:center; gap:8px;
  }
  .lead{color:var(--dim); font-size:13.5px; line-height:1.7; margin:0 0 14px;}

  /* ---- Buttons ---- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px 16px; border-radius:12px; border:none;
    font-family:'Noto Sans JP'; font-weight:700; font-size:15.5px;
    cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .btn-primary{background:linear-gradient(180deg, #D9FF7A, var(--led)); color:#0A2A16; box-shadow:0 6px 18px rgba(198,255,77,0.25);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary:disabled{opacity:0.35; box-shadow:none;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .btn-ghost:active{background:rgba(255,255,255,0.05);}
  .btn-danger{background:transparent; border:1px solid rgba(255,77,109,0.4); color:var(--love);}

  .fixed-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(0deg, var(--bg) 60%, rgba(6,31,23,0));
    max-width:520px; margin:0 auto;
  }

  /* ---- Roster (racing card) ---- */
  .unit-block{margin-bottom:16px;}
  .unit-title{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
    font-family:'Teko'; font-size:20px; font-weight:600;
  }
  .unit-title .bar{width:5px; height:18px; border-radius:2px;}
  .unit-love .bar{background:var(--love);}
  .unit-me .bar{background:var(--me);}
  .unit-joy .bar{background:var(--joy);}
  .unit-love .unit-title{color:var(--love);}
  .unit-me .unit-title{color:var(--me);}
  .unit-joy .unit-title{color:var(--joy);}

  .roster-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .horse{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.03); border:1px solid var(--line);
    border-radius:10px; padding:8px 9px;
  }
  .num{
    flex:none; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Teko'; font-weight:700; font-size:14px; color:#06170F;
  }
  .unit-love .num{background:var(--love); color:#3A0410;}
  .unit-me .num{background:var(--me); color:#032538;}
  .unit-joy .num{background:var(--joy); color:#3A1E00;}
  .horse .name{font-size:12.5px; font-weight:500; line-height:1.3;}

  /* ---- Title input ---- */
  .field label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px; letter-spacing:0.05em;}
  .field input[type=text]{
    width:100%; padding:14px; border-radius:10px; border:1px solid var(--line);
    background:rgba(0,0,0,0.25); color:var(--white); font-size:15.5px; font-family:'Noto Sans JP';
  }
  .field input[type=text]::placeholder{color:#5C7A6A;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px;}
  .chip{
    padding:7px 11px; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,0.04); color:var(--dim); font-size:12px; cursor:pointer;
  }
  .chip:active{background:rgba(198,255,77,0.15); color:var(--led);}

  /* ---- Slot picker (mark sheet feel) ---- */
  .slot-row{display:flex; gap:8px; margin-bottom:10px;}
  .slot{
    flex:1; min-height:64px; border-radius:12px; border:1.5px dashed rgba(255,255,255,0.22);
    background:rgba(0,0,0,0.2); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px 4px; text-align:center; cursor:pointer;
  }
  .slot .rank{font-family:'Teko'; font-size:12px; color:var(--dim); letter-spacing:0.1em;}
  .slot .val{font-size:12.5px; font-weight:700; margin-top:4px; line-height:1.25;}
  .slot.filled{border-style:solid; border-color:var(--led); background:rgba(198,255,77,0.08);}
  .slot .badge{
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Teko'; font-weight:700; font-size:13px; margin-top:3px;
  }
  .slot.empty .plus{font-size:20px; color:var(--dim); font-family:'Teko';}

  /* ---- Prediction card ---- */
  .pred-card{
    background:rgba(255,255,255,0.025); border:1px solid var(--line); border-radius:14px;
    padding:12px; margin-bottom:12px; position:relative;
  }
  .pred-card .pred-label{
    font-family:'Teko'; font-size:18px; color:var(--gold); margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .pred-card .pred-label .n{
    width:22px; height:22px; border-radius:50%; background:var(--gold); color:#3A2500;
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }

  /* ---- Result stamp ---- */
  .stamp{
    position:absolute; top:10px; right:10px; padding:4px 10px; border-radius:6px;
    font-family:'Teko'; font-weight:700; font-size:14px; letter-spacing:0.05em;
    border:2px solid; transform:rotate(-8deg); opacity:0; animation:stampIn 0.35s ease forwards;
  }
  .stamp.hit{color:var(--love); border-color:var(--love); background:rgba(255,77,109,0.08);}
  .stamp.miss{color:var(--dim); border-color:rgba(255,255,255,0.25); background:rgba(255,255,255,0.03); transform:rotate(-4deg);}
  .stamp.box{color:var(--gold); border-color:var(--gold); background:rgba(255,197,49,0.08);}
  @keyframes stampIn{
    0%{opacity:0; transform:rotate(-20deg) scale(1.6);}
    70%{opacity:1;}
    100%{opacity:1; transform:rotate(-8deg) scale(1);}
  }

  /* ---- Overlay picker ---- */
  #overlay{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:none; flex-direction:column;
  }
  #overlay.show{display:flex;}
  .ov-head{
    padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;
    background:var(--bg2);
  }
  .ov-back{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent;
    color:var(--led); font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .ov-title{font-family:'Teko'; font-size:20px; color:var(--led); font-weight:600;}
  .ov-body{flex:1; overflow-y:auto; padding:14px 18px 30px;}
  .ov-item{
    display:flex; align-items:center; gap:12px; padding:11px 8px; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .ov-item.disabled{opacity:0.25;}
  .ov-item .name{font-size:14.5px; font-weight:500; flex:1;}
  .ov-item .num{width:30px; height:30px; font-size:15px;}

  /* ---- Reveal ---- */
  .podium{display:flex; gap:8px; margin-bottom:16px;}
  .podium .slot-r{
    flex:1; border-radius:14px; padding:14px 6px; text-align:center;
    background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--line);
    opacity:0; animation:flip 0.5s ease forwards;
  }
  .podium .slot-r:nth-child(1){animation-delay:0.05s;}
  .podium .slot-r:nth-child(2){animation-delay:0.35s;}
  .podium .slot-r:nth-child(3){animation-delay:0.65s;}
  @keyframes flip{
    0%{opacity:0; transform:rotateX(90deg) translateY(-6px);}
    100%{opacity:1; transform:rotateX(0) translateY(0);}
  }
  .podium .rk{font-family:'Teko'; font-size:13px; color:var(--dim); letter-spacing:0.15em;}
  .podium .num{width:34px; height:34px; font-size:16px; margin:8px auto 6px;}
  .podium .nm{font-size:12px; font-weight:700; line-height:1.3;}
  .podium .slot-r.masked{opacity:0.55; animation:none;}
  .podium .badge.mask{background:rgba(255,255,255,0.06); color:var(--dim); border:1px dashed var(--line);}
  .podium .slot-r.masked .nm{color:var(--dim);}

  .summary-line{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Teko'; margin-bottom:14px;
  }
  .summary-line .big{font-size:30px; color:var(--led);}
  .summary-line .small{font-size:13px; color:var(--dim);}

  .empty-note{font-size:12px; color:#5C7A6A; text-align:center; padding:10px 0;}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <div class="ov-head">
    <button class="ov-back" id="ovBack">‹</button>
    <div class="ov-title" id="ovTitle">選択</div>
  </div>
  <div class="ov-body" id="ovBody"></div>
</div>

<script>
/* ---------------- data ---------------- */
const UNITS = [
  { key:'love', label:'＝LOVE', cls:'unit-love', members:[
    '大谷 映美里','大場 花菜','音嶋 莉沙','齋藤 樹愛羅','佐々木 舞香',
    '髙松 瞳','瀧脇 笙古','野口 衣織','諸橋 沙夏','山本 杏奈'
  ]},
  { key:'me', label:'≠ME', cls:'unit-me', members:[
    '尾木 波菜','落合 希来里','蟹沢 萌子','河口 夏音','川中子 奈月心',
    '櫻井 もも','鈴木 瞳美','谷崎 早耶','冨田 菜々風','永田 詩央里','本田 珠由記'
  ]},
  { key:'joy', label:'≒JOY', cls:'unit-joy', members:[
    '逢田 珠里依','天野 香乃愛','市原 愛弓','江角 怜音','大信田 美月',
    '大西 葵','小澤 愛実','髙橋 舞','藤沢 莉子','村山 結香','山田 杏佳','山野 愛月'
  ]}
];

const HORSES = [];
{
  let n = 1;
  UNITS.forEach(u=>{
    u.members.forEach(name=>{
      HORSES.push({num:n, name, unit:u.key, cls:u.cls});
      n++;
    });
  });
}
function horse(num){ return HORSES.find(h=>h.num===num); }

const SUGGESTIONS = [
  '飲み会で一番はしゃぎそうランキング','お酒に強そうランキング','歌が上手そうランキング',
  '寝坊しそうランキング','恋愛偏差値高そうランキング','ドッキリに引っかかりそうランキング',
  '実は毒舌ランキング','リーダーシップありそうランキング','ラーメン好きそうランキング',
  '一番モテそうランキング','天然っぽいランキング','ゲーム強そうランキング'
];

/* ---------------- state ---------------- */
let screen = 'roster';        // roster | setup | ready | guess | reveal
let round = 1;
let answer = { title:'', order:[null,null,null] };
let predictions = [];         // filled on entering guess screen
const PRED_COUNT = 5;

let picker = null; // {mode:'answer'|'pred', predIndex, slotIndex}
let revealStage = 0;      // 0..3 = how many of 1st/2nd/3rd have been revealed
let resultsShown = false; // whether prediction judging is shown

/* ---------------- helpers ---------------- */
function usedInSet(mode, predIndex, excludeSlot){
  const arr = mode==='answer' ? answer.order : predictions[predIndex].order;
  return arr.filter((v,i)=> v!==null && i!==excludeSlot);
}

function newPredictions(){
  predictions = Array.from({length:PRED_COUNT}, ()=>({order:[null,null,null]}));
}

/* ---------------- render root ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = header() + body() + footer();
  attachEvents();
}

function stepIndex(){
  return {roster:0, setup:1, ready:1, guess:2, reveal:3}[screen];
}

function header(){
  const titles = {
    roster:['ENTRY LIST','出馬表'],
    setup:['ROUND '+round,'出題する'],
    ready:['ROUND '+round,'回答者に渡す'],
    guess:['ROUND '+round,'3連単を予想'],
    reveal:['RESULT','正解発表']
  };
  const [kicker, title] = titles[screen];
  const idx = stepIndex();
  let dots = '';
  for(let i=0;i<4;i++){ dots += `<div class="dot ${i<=idx?'on':''}"></div>`; }
  return `
  <div class="board-head">
    <div class="kicker">${kicker}</div>
    <h1 class="disp">${title}</h1>
    <div class="steps">${dots}</div>
  </div>`;
}

function body(){
  if(screen==='roster') return rosterScreen();
  if(screen==='setup') return setupScreen();
  if(screen==='ready') return readyScreen();
  if(screen==='guess') return guessScreen();
  if(screen==='reveal') return revealScreen();
  return '';
}

function footer(){
  if(screen==='roster'){
    return `<div class="fixed-bar"><button class="btn btn-primary" id="btnStart">出題をはじめる ▶</button></div>`;
  }
  if(screen==='setup'){
    const ok = answer.title.trim().length>0 && answer.order.every(v=>v!==null);
    return `<div class="fixed-bar"><button class="btn btn-primary" id="btnToReady" ${ok?'':'disabled'}>回答者に渡す ▶</button></div>`;
  }
  if(screen==='ready'){
    return `<div class="fixed-bar"><button class="btn btn-primary" id="btnToGuess">予想スタート ▶</button></div>`;
  }
  if(screen==='guess'){
    const ok = predictions.some(p=>p.order.every(v=>v!==null));
    return `<div class="fixed-bar"><button class="btn btn-primary" id="btnReveal" ${ok?'':'disabled'}>正解を発表する ▶</button></div>`;
  }
  if(screen==='reveal'){
    if(!resultsShown){
      const labels = ['1着を発表 ▶','2着を発表 ▶','3着を発表 ▶','予想の結果を見る ▶'];
      return `<div class="fixed-bar"><button class="btn btn-primary" id="btnRevealStep">${labels[revealStage]}</button></div>`;
    }
    return `<div class="fixed-bar"><button class="btn btn-primary" id="btnAgain">もう一度お題を出す ▶</button></div>`;
  }
  return '';
}

/* ---------------- screens ---------------- */
function rosterScreen(){
  let html = `<div class="content">
    <div class="panel">
      <h2>◆ RULES</h2>
      <p class="lead">出題者がメンバーのランキングお題を決めて1〜3位を予想。回答者は5通りまで3連単（1着・2着・3着を的中順で予想）にチャレンジ。全員的中したら勝ち！飲み会のノリでどうぞ🍻</p>
    </div>`;
  UNITS.forEach(u=>{
    html += `<div class="unit-block ${u.cls}">
      <div class="unit-title"><span class="bar"></span>${u.label}</div>
      <div class="roster-grid">
        ${u.members.map((name)=>{
          const h = HORSES.find(hh=>hh.name===name && hh.unit===u.key);
          return `<div class="horse"><div class="num">${h.num}</div><div class="name">${name}</div></div>`;
        }).join('')}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function slotHtml(mode, predIndex, slotIndex, order){
  const rankLabel = ['1着','2着','3着'][slotIndex];
  const val = order[slotIndex];
  if(val===null){
    return `<div class="slot empty" data-mode="${mode}" data-pred="${predIndex}" data-slot="${slotIndex}">
      <div class="rank">${rankLabel}</div>
      <div class="plus">＋</div>
    </div>`;
  }
  const h = horse(val);
  return `<div class="slot filled ${h.cls}" data-mode="${mode}" data-pred="${predIndex}" data-slot="${slotIndex}">
    <div class="rank">${rankLabel}</div>
    <div class="badge">${h.num}</div>
    <div class="val">${h.name}</div>
  </div>`;
}

function setupScreen(){
  return `<div class="content">
    <div class="panel">
      <h2>お題を決める</h2>
      <p class="lead">イコノイジョイメンバーで自由にランキングを作ってください。</p>
      <div class="field">
        <label>ランキングお題</label>
        <input type="text" id="titleInput" placeholder="例：飲み会で一番はしゃぎそうランキング" value="${escapeHtml(answer.title)}">
        <div class="chips" id="chips">
          ${SUGGESTIONS.map(s=>`<div class="chip" data-title="${escapeHtml(s)}">${s}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>1〜3位を選ぶ</h2>
      <p class="lead">回答者に見られないうちに決めてください。</p>
      <div class="slot-row">
        ${slotHtml('answer', 0, 0, answer.order)}
        ${slotHtml('answer', 0, 1, answer.order)}
        ${slotHtml('answer', 0, 2, answer.order)}
      </div>
    </div>
  </div>`;
}

function readyScreen(){
  return `<div class="content">
    <div class="panel" style="text-align:center; padding:34px 16px;">
      <div class="disp" style="font-size:20px; color:var(--gold); margin-bottom:10px;">お題</div>
      <div style="font-size:17px; font-weight:700; margin-bottom:22px;">「${escapeHtml(answer.title)}」</div>
      <p class="lead" style="margin-bottom:0;">出題者の1〜3位は伏せられました。<br>このままスマホを回答者に渡してください。<br>（正解発表まで答えは表示されません）</p>
    </div>
  </div>`;
}

function guessScreen(){
  let html = `<div class="content">
    <div class="panel" style="padding:14px 16px;">
      <div style="font-size:11px; color:var(--dim); letter-spacing:0.1em; margin-bottom:4px;">TITLE</div>
      <div style="font-size:15.5px; font-weight:700;">「${escapeHtml(answer.title)}」</div>
    </div>
    <p class="lead" style="margin:0 0 12px;">最大5通りまで3連単を予想できます。1つ以上決めたら発表できます（空欄は未使用になります）。</p>`;
  predictions.forEach((p, i)=>{
    html += `<div class="pred-card">
      <div class="pred-label"><span class="n">${i+1}</span>予想 ${i+1}</div>
      <div class="slot-row">
        ${slotHtml('pred', i, 0, p.order)}
        ${slotHtml('pred', i, 1, p.order)}
        ${slotHtml('pred', i, 2, p.order)}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function revealScreen(){
  let podium = `<div class="podium">`;
  ['1着','2着','3着'].forEach((label,i)=>{
    if(revealStage>i){
      const h = horse(answer.order[i]);
      podium += `<div class="slot-r ${h.cls}" style="animation-delay:0s;">
        <div class="rk">${label}</div>
        <div class="badge num">${h.num}</div>
        <div class="nm">${h.name}</div>
      </div>`;
    } else {
      podium += `<div class="slot-r masked">
        <div class="rk">${label}</div>
        <div class="badge num mask">？</div>
        <div class="nm">???</div>
      </div>`;
    }
  });
  podium += `</div>`;

  const statusTexts = [
    'いよいよ結果発表…！',
    '1着が判明！続いて2着は…？',
    '2着も判明！ラストは3着…！',
    '3着まで出そろいました！'
  ];

  let html = `<div class="content">
    <div class="panel" style="text-align:center;">
      <div style="font-size:12px; color:var(--dim); margin-bottom:6px;">お題「${escapeHtml(answer.title)}」の正解</div>
      ${podium}
      <div class="disp" style="font-size:16px; color:var(--gold); margin-top:2px;">${statusTexts[revealStage]}</div>
    </div>`;

  if(resultsShown){
    const validPreds = predictions.filter(p=>p.order.every(v=>v!==null));
    const hitExact = validPreds.filter(p=> p.order[0]===answer.order[0] && p.order[1]===answer.order[1] && p.order[2]===answer.order[2] ).length;

    html += `<div class="panel" style="text-align:center;">
      <div class="summary-line" style="justify-content:center; gap:10px; margin-bottom:0;">
        <span class="big">${hitExact}</span><span class="small">／ ${validPreds.length} 通り的中</span>
      </div>
    </div>`;

    predictions.forEach((p, i)=>{
      if(!p.order.every(v=>v!==null)) return;
      const exact = p.order[0]===answer.order[0] && p.order[1]===answer.order[1] && p.order[2]===answer.order[2];
      const box = !exact && sameSet(p.order, answer.order);
      const stampCls = exact ? 'hit' : (box ? 'box' : 'miss');
      const stampText = exact ? '的中！' : (box ? '着順違い' : 'はずれ');
      html += `<div class="pred-card">
        <div class="stamp ${stampCls}">${stampText}</div>
        <div class="pred-label"><span class="n">${i+1}</span>予想 ${i+1}</div>
        <div class="slot-row">
          ${p.order.map((v,si)=>{
            const h = horse(v);
            const correct = v===answer.order[si];
            return `<div class="slot filled ${h.cls}" style="${correct?'box-shadow:0 0 0 2px var(--led) inset;':''}">
              <div class="rank">${['1着','2着','3着'][si]}</div>
              <div class="badge">${h.num}</div>
              <div class="val">${h.name}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });

    if(validPreds.length===0){
      html += `<div class="empty-note">予想が入力されていません</div>`;
    }
  }

  html += `</div>`;
  return html;
}

function sameSet(a,b){
  const sa=[...a].sort().join(','), sb=[...b].sort().join(',');
  return sa===sb;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- events ---------------- */
function attachEvents(){
  const btnStart = document.getElementById('btnStart');
  if(btnStart) btnStart.onclick = ()=>{ screen='setup'; render(); };

  const titleInput = document.getElementById('titleInput');
  if(titleInput){
    titleInput.oninput = (e)=>{ answer.title = e.target.value; updateFooterOnly(); };
  }
  document.querySelectorAll('#chips .chip').forEach(c=>{
    c.onclick = ()=>{ answer.title = c.getAttribute('data-title'); render(); };
  });

  document.querySelectorAll('.slot').forEach(s=>{
    s.onclick = ()=>{
      const mode = s.getAttribute('data-mode');
      const predIndex = parseInt(s.getAttribute('data-pred'));
      const slotIndex = parseInt(s.getAttribute('data-slot'));
      openPicker(mode, predIndex, slotIndex);
    };
  });

  const btnToReady = document.getElementById('btnToReady');
  if(btnToReady) btnToReady.onclick = ()=>{ screen='ready'; render(); };

  const btnToGuess = document.getElementById('btnToGuess');
  if(btnToGuess) btnToGuess.onclick = ()=>{ newPredictions(); screen='guess'; render(); };

  const btnReveal = document.getElementById('btnReveal');
  if(btnReveal) btnReveal.onclick = ()=>{ revealStage=0; resultsShown=false; screen='reveal'; render(); };

  const btnRevealStep = document.getElementById('btnRevealStep');
  if(btnRevealStep) btnRevealStep.onclick = ()=>{
    if(revealStage<3){ revealStage += 1; render(); }
    else { resultsShown = true; render(); }
  };

  const btnAgain = document.getElementById('btnAgain');
  if(btnAgain) btnAgain.onclick = ()=>{
    round += 1;
    answer = { title:'', order:[null,null,null] };
    predictions = [];
    revealStage = 0; resultsShown = false;
    screen='setup'; render();
  };
}

function updateFooterOnly(){
  const app = document.getElementById('app');
  const existingFooter = app.querySelector('.fixed-bar');
  if(existingFooter) existingFooter.outerHTML = footer();
  const btn = document.getElementById('btnToReady');
  if(btn) btn.onclick = ()=>{ screen='ready'; render(); };
}

/* ---------------- picker overlay ---------------- */
function openPicker(mode, predIndex, slotIndex){
  picker = {mode, predIndex, slotIndex};
  const rankLabel = ['1着','2着','3着'][slotIndex];
  document.getElementById('ovTitle').textContent = rankLabel + 'を選ぶ';
  const used = usedInSet(mode, predIndex, slotIndex);
  const currentVal = (mode==='answer' ? answer.order : predictions[predIndex].order)[slotIndex];

  let html = '';
  UNITS.forEach(u=>{
    html += `<div class="unit-title ${u.cls}" style="margin-top:14px;"><span class="bar"></span>${u.label}</div>`;
    HORSES.filter(h=>h.unit===u.key).forEach(h=>{
      const disabled = used.includes(h.num) && h.num!==currentVal;
      html += `<div class="ov-item ${disabled?'disabled':''}" data-num="${h.num}">
        <div class="num badge ${h.cls}" style="border-radius:50%; display:flex; align-items:center; justify-content:center;">${h.num}</div>
        <div class="name">${h.name}</div>
        ${h.num===currentVal ? '<div style="color:var(--led); font-size:18px;">✓</div>' : ''}
      </div>`;
    });
  });
  document.getElementById('ovBody').innerHTML = html;
  document.querySelectorAll('.ov-item').forEach(item=>{
    if(item.classList.contains('disabled')) return;
    item.onclick = ()=>{
      const num = parseInt(item.getAttribute('data-num'));
      if(picker.mode==='answer'){ answer.order[picker.slotIndex] = num; }
      else { predictions[picker.predIndex].order[picker.slotIndex] = num; }
      closePicker();
      render();
    };
  });
  document.getElementById('overlay').classList.add('show');
}
function closePicker(){
  document.getElementById('overlay').classList.remove('show');
  picker = null;
}
document.getElementById('ovBack').onclick = closePicker;

/* ---------------- init ---------------- */
render();
</script>
</body>
</html>
