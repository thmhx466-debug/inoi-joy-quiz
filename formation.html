<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>イコノイジョイ フォーメーションシミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0A0912;
    --bg2:#131226;
    --panel:#171633;
    --panel2:#1E1C3F;
    --line: rgba(255,214,102,0.16);
    --gold:#FFD166;
    --gold-dim:#B6893A;
    --white:#F5F3EC;
    --dim:#9B96C4;
    --love:#FF4D8D;
    --me:#4DC3FF;
    --joy:#FFA23C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 700px 400px at 50% 0%, rgba(255,209,102,0.16), transparent 60%),
      radial-gradient(ellipse 500px 300px at 50% 8%, rgba(255,77,141,0.08), transparent 60%),
      var(--bg);
    color:var(--white);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .disp{font-family:'Teko','Noto Sans JP',sans-serif; letter-spacing:0.02em;}

  #app{max-width:560px; margin:0 auto; padding:0 0 190px; position:relative;}

  .board-head{
    padding: calc(env(safe-area-inset-top) + 18px) 18px 14px;
    background:linear-gradient(180deg, var(--bg2), var(--bg) 90%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .board-head .kicker{font-size:11px; letter-spacing:0.35em; color:var(--gold-dim); font-weight:700;}
  .board-head h1{
    font-family:'Teko'; font-weight:700; font-size:32px; line-height:1.05;
    margin:4px 0 0; color:var(--gold);
    text-shadow:0 0 16px rgba(255,209,102,0.35);
  }

  .content{padding:18px;}

  .panel{
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel h2{
    font-family:'Teko'; font-size:21px; font-weight:600; margin:0 0 10px; color:var(--gold);
  }
  .lead{color:var(--dim); font-size:13px; line-height:1.7; margin:0 0 12px;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px 16px; border-radius:12px; border:none;
    font-family:'Noto Sans JP'; font-weight:700; font-size:15px;
    cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .btn-primary{background:linear-gradient(180deg, #FFE6A0, var(--gold)); color:#3A2400; box-shadow:0 6px 18px rgba(255,209,102,0.25);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary:disabled{opacity:0.35; box-shadow:none;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .btn-ghost:active{background:rgba(255,255,255,0.05);}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}

  .fixed-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(0deg, var(--bg) 65%, rgba(10,9,18,0));
    max-width:560px; margin:0 auto;
    display:flex; flex-direction:column; gap:8px;
  }

  /* ---- setup: unit chips ---- */
  .unit-chips{display:flex; gap:8px; margin-bottom:4px;}
  .unit-chip{
    flex:1; padding:10px 6px; border-radius:12px; text-align:center;
    border:1.5px solid var(--line); background:rgba(255,255,255,0.03);
    font-family:'Teko'; font-size:16px; font-weight:600; color:var(--dim); cursor:pointer;
  }
  .unit-chip.on.love{border-color:var(--love); color:var(--love); background:rgba(255,77,141,0.1);}
  .unit-chip.on.me{border-color:var(--me); color:var(--me); background:rgba(77,195,255,0.1);}
  .unit-chip.on.joy{border-color:var(--joy); color:var(--joy); background:rgba(255,162,60,0.1);}

  .field label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px;}
  .field input[type=text]{
    width:100%; padding:13px; border-radius:10px; border:1px solid var(--line);
    background:rgba(0,0,0,0.25); color:var(--white); font-size:15px; font-family:'Noto Sans JP';
  }
  .field input::placeholder{color:#615C8C;}

  /* ---- preset cards ---- */
  .preset-list{display:flex; flex-direction:column; gap:8px;}
  .preset{
    border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    background:rgba(255,255,255,0.02); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
  }
  .preset.on{border-color:var(--gold); background:rgba(255,209,102,0.08);}
  .preset .pname{font-weight:700; font-size:14px;}
  .preset .pcount{font-family:'Teko'; font-size:13px; color:var(--dim);}
  .preset.on .pcount{color:var(--gold);}

  /* ---- custom row editor ---- */
  .row-editor{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .row-editor-row{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    background:rgba(0,0,0,0.15);
  }
  .row-editor-row .rlabel{font-family:'Teko'; font-size:14px; color:var(--dim); width:52px;}
  .stepper{display:flex; align-items:center; gap:10px; flex:1; justify-content:center;}
  .stepper button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
    background:rgba(255,255,255,0.04); color:var(--gold); font-size:16px; font-family:'Teko';
  }
  .stepper .n{font-family:'Teko'; font-size:18px; width:24px; text-align:center;}
  .row-editor-row .rdel{color:var(--love); font-size:18px; width:26px; text-align:center;}

  /* ---- stage screen ---- */
  .stage-title{
    text-align:center; font-family:'Teko'; font-size:20px; color:var(--gold);
    letter-spacing:0.04em; margin-bottom:14px; min-height:20px;
  }
  #stageCapture{
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,214,102,0.18), transparent 65%),
      linear-gradient(180deg, #141230, #0A0912 75%);
    border:1px solid var(--line); border-radius:18px;
    padding:22px 10px 18px;
    margin-bottom:16px;
  }
  .stage-row{display:flex; justify-content:center; gap:8px; margin-bottom:16px; transform-origin:center;}
  .slot{
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    border:1.5px dashed rgba(255,255,255,0.25); background:rgba(255,255,255,0.02);
    font-size:9.5px; text-align:center; line-height:1.15; padding:2px; cursor:pointer;
    color:var(--dim); font-weight:500;
  }
  .slot.filled{border-style:solid; background:rgba(255,255,255,0.06);}
  .slot.filled.love{border-color:var(--love); box-shadow:0 0 10px rgba(255,77,141,0.35);}
  .slot.filled.me{border-color:var(--me); box-shadow:0 0 10px rgba(77,195,255,0.35);}
  .slot.filled.joy{border-color:var(--joy); box-shadow:0 0 10px rgba(255,162,60,0.35);}
  .slot.filled .snm{color:var(--white); font-weight:700; font-size:10px;}
  .slot.center-slot{width:66px; height:66px;}
  .slot.center-slot.filled{
    box-shadow:0 0 0 3px var(--gold), 0 0 22px rgba(255,209,102,0.6);
    border-color:var(--gold) !important;
  }
  .slot.center-slot .snm{font-size:11px;}
  .slot.selected-target{border-color:var(--gold); background:rgba(255,209,102,0.12); animation:pulseSlot 1s infinite;}
  @keyframes pulseSlot{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0.5);} 50%{box-shadow:0 0 0 6px rgba(255,209,102,0);}}

  .hand-bar{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
    background:rgba(255,209,102,0.1); border:1px solid var(--gold); margin-bottom:12px;
    font-size:13px;
  }
  .hand-bar .hb-badge{
    width:28px; height:28px; border-radius:50%; background:var(--gold); color:#3A2400;
    display:flex; align-items:center; justify-content:center; font-family:'Teko'; font-weight:700; flex:none;
  }
  .hand-bar b{color:var(--gold);}

  /* ---- roster ---- */
  .roster-title{font-family:'Teko'; font-size:16px; color:var(--dim); margin:6px 0 8px; letter-spacing:0.05em;}
  .unit-section{margin-bottom:12px;}
  .unit-section .u-head{
    display:flex; align-items:center; gap:6px; font-family:'Teko'; font-size:16px; font-weight:600; margin-bottom:6px;
  }
  .unit-section .u-head .bar{width:4px; height:14px; border-radius:2px;}
  .unit-section.love .u-head{color:var(--love);} .unit-section.love .bar{background:var(--love);}
  .unit-section.me .u-head{color:var(--me);} .unit-section.me .bar{background:var(--me);}
  .unit-section.joy .u-head{color:var(--joy);} .unit-section.joy .bar{background:var(--joy);}

  .chip-wrap{display:flex; flex-wrap:wrap; gap:7px;}
  .m-chip{
    padding:7px 11px; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,0.03); font-size:12.5px; cursor:pointer; color:var(--white);
    display:flex; align-items:center; gap:5px;
  }
  .m-chip.placed{opacity:0.4; border-style:dashed;}
  .m-chip.selected{border-color:var(--gold); background:rgba(255,209,102,0.15); color:var(--gold); font-weight:700;}
  .m-chip .tag{font-size:9px; color:var(--dim);}

  .empty-note{font-size:12px; color:#615C8C; text-align:center; padding:12px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- data ---------------- */
const UNITS = [
  { key:'love', label:'＝LOVE', cls:'love', members:[
    '大谷 映美里','大場 花菜','音嶋 莉沙','齋藤 樹愛羅','佐々木 舞香',
    '髙松 瞳','瀧脇 笙古','野口 衣織','諸橋 沙夏','山本 杏奈'
  ]},
  { key:'me', label:'≠ME', cls:'me', members:[
    '尾木 波菜','落合 希来里','蟹沢 萌子','河口 夏音','川中子 奈月心',
    '櫻井 もも','鈴木 瞳美','谷崎 早耶','冨田 菜々風','永田 詩央里','本田 珠由記'
  ]},
  { key:'joy', label:'≒JOY', cls:'joy', members:[
    '逢田 珠里依','天野 香乃愛','市原 愛弓','江角 怜音','大信田 美月',
    '大西 葵','小澤 愛実','髙橋 舞','藤沢 莉子','村山 結香','山田 杏佳','山野 愛月'
  ]}
];
const MEMBERS = [];
{
  let n=1;
  UNITS.forEach(u=>{ u.members.forEach(name=>{ MEMBERS.push({num:n, name, unit:u.key, cls:u.cls}); n++; }); });
}
function member(num){ return MEMBERS.find(m=>m.num===num); }

const PRESETS = [
  { key:'pyramid', name:'センター1（ピラミッド 4-3-2-1）', rows:[4,3,2,1] },
  { key:'mini', name:'センター1（コンパクト）', rows:[5,4,3,1] },
  { key:'std', name:'センター1（スタンダード）', rows:[7,6,5,3,1] },
  { key:'full', name:'全員フォーメーション（34人）', rows:[12,11,11] },
  { key:'custom', name:'カスタム（列数・人数を自分で決める）', rows:[5,4,3,1] }
];

/* ---------------- state ---------------- */
let screen = 'setup';
let unitFilter = { love:true, me:true, joy:true };
let formationTitle = '';
let selectedPreset = 'mini';
let customRows = [5,4,3,1];
let rowsConfig = [5,4,3,1];

let stage = [];      // array of rows, each an array of member-num-or-null, back row first
let selected = null;  // member num currently "in hand"

function filteredMembers(){
  return MEMBERS.filter(m=>unitFilter[m.unit]);
}
function placedNums(){
  const s = new Set();
  stage.forEach(row=>row.forEach(v=>{ if(v!==null) s.add(v); }));
  return s;
}
function buildStageFromRows(rows){
  stage = rows.map(count=>Array.from({length:count}, ()=>null));
}

/* ---------------- render root ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = header() + body() + footer();
  attachEvents();
}

function header(){
  if(screen==='setup'){
    return `<div class="board-head">
      <div class="kicker">STAGE BUILDER</div>
      <h1 class="disp">フォーメーションを組む</h1>
    </div>`;
  }
  return `<div class="board-head">
    <div class="kicker">FORMATION</div>
    <h1 class="disp">ステージ</h1>
  </div>`;
}

function body(){
  return screen==='setup' ? setupScreen() : stageScreen();
}

function footer(){
  if(screen==='setup'){
    return `<div class="fixed-bar">
      <button class="btn btn-primary" id="btnBuild">この隊形でスタート ▶</button>
    </div>`;
  }
  return `<div class="fixed-bar">
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnReset">やり直す</button>
      <button class="btn btn-ghost" id="btnBack">隊形を変更</button>
    </div>
    <button class="btn btn-primary" id="btnSave">📷 画像として保存</button>
  </div>`;
}

/* ---------------- setup screen ---------------- */
function setupScreen(){
  let html = `<div class="content">
    <div class="panel">
      <h2>① 使うメンバーを選ぶ</h2>
      <div class="unit-chips">
        <div class="unit-chip love ${unitFilter.love?'on':''}" data-unit="love">＝LOVE</div>
        <div class="unit-chip me ${unitFilter.me?'on':''}" data-unit="me">≠ME</div>
        <div class="unit-chip joy ${unitFilter.joy?'on':''}" data-unit="joy">≒JOY</div>
      </div>
    </div>

    <div class="panel">
      <h2>② タイトル（任意）</h2>
      <div class="field">
        <input type="text" id="titleInput" placeholder="例：〇〇 フォーメーション" value="${escapeHtml(formationTitle)}">
      </div>
    </div>

    <div class="panel">
      <h2>③ 隊形を選ぶ</h2>
      <p class="lead">後列→前列の順。一番前が奇数人数だとセンターが1人になります。</p>
      <div class="preset-list">
        ${PRESETS.map(p=>{
          const rows = p.key==='custom' ? customRows : p.rows;
          const total = rows.reduce((a,b)=>a+b,0);
          return `<div class="preset ${selectedPreset===p.key?'on':''}" data-preset="${p.key}">
            <span class="pname">${p.name}</span>
            <span class="pcount">${rows.join('-')} ／ 計${total}人</span>
          </div>`;
        }).join('')}
      </div>
      ${selectedPreset==='custom' ? customRowEditor() : ''}
    </div>
  </div>`;
  return html;
}

function customRowEditor(){
  let html = `<div class="row-editor">`;
  customRows.forEach((count, i)=>{
    const label = i===customRows.length-1 ? '最前列' : (i===0 ? '最後列' : `${i+1}列目`);
    html += `<div class="row-editor-row">
      <div class="rlabel">${label}</div>
      <div class="stepper">
        <button data-rowdec="${i}" ${count<=1?'disabled':''}>−</button>
        <div class="n">${count}</div>
        <button data-rowinc="${i}" ${count>=14?'disabled':''}>＋</button>
      </div>
      <div class="rdel" data-rowdel="${i}">${customRows.length>1?'✕':''}</div>
    </div>`;
  });
  html += `</div>
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn btn-ghost" id="btnAddRow" ${customRows.length>=6?'disabled':''}>＋ 列を追加</button>
  </div>`;
  return html;
}

/* ---------------- stage screen ---------------- */
function stageScreen(){
  const rows = stage.length ? stage : [[]];
  const rowCount = rows.length;

  let stageHtml = `<div id="stageCapture">
    <div class="stage-title">${escapeHtml(formationTitle) || '&nbsp;'}</div>`;

  rows.forEach((row, r)=>{
    const t = rowCount>1 ? r/(rowCount-1) : 1;
    const scale = 0.82 + t*0.26;
    const opacity = 0.72 + t*0.28;
    const isFrontRow = r===rowCount-1;
    const midIndex = (row.length-1)/2;
    stageHtml += `<div class="stage-row" style="transform:scale(${scale.toFixed(2)}); opacity:${opacity.toFixed(2)};">`;
    row.forEach((val, c)=>{
      const isCenter = isFrontRow && row.length%2===1 && c===midIndex;
      const filled = val!==null;
      const m = filled ? member(val) : null;
      stageHtml += `<div class="slot ${filled?'filled '+m.cls:''} ${isCenter?'center-slot':''}"
        data-row="${r}" data-col="${c}">
        ${filled ? `<div class="snm">${escapeHtml(m.name)}</div>` : `<div>${isCenter?'★':(r+1)+'-'+(c+1)}</div>`}
      </div>`;
    });
    stageHtml += `</div>`;
  });
  stageHtml += `</div>`;

  let html = `<div class="content">`;
  if(selected!==null){
    const m = member(selected);
    html += `<div class="hand-bar">
      <div class="hb-badge">${m.num}</div>
      <div><b>${escapeHtml(m.name)}</b> を選択中 — 配置したい枠をタップ</div>
    </div>`;
  }
  html += stageHtml;

  html += `<div class="roster-title">MEMBERS（タップして選択 → ステージへ配置）</div>`;
  const placed = placedNums();
  UNITS.forEach(u=>{
    if(!unitFilter[u.key]) return;
    const list = MEMBERS.filter(m=>m.unit===u.key);
    html += `<div class="unit-section ${u.cls}">
      <div class="u-head"><span class="bar"></span>${u.label}</div>
      <div class="chip-wrap">
        ${list.map(m=>{
          const isPlaced = placed.has(m.num);
          const isSelected = selected===m.num;
          return `<div class="m-chip ${isPlaced?'placed':''} ${isSelected?'selected':''}" data-mnum="${m.num}">
            ${escapeHtml(m.name)}${isPlaced?'<span class="tag">配置済</span>':''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------------- helpers ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- events ---------------- */
function attachEvents(){
  // setup screen
  document.querySelectorAll('.unit-chip').forEach(el=>{
    el.onclick = ()=>{
      const u = el.getAttribute('data-unit');
      const activeCount = Object.values(unitFilter).filter(Boolean).length;
      if(unitFilter[u] && activeCount===1) return; // keep at least one unit selected
      unitFilter[u] = !unitFilter[u];
      render();
    };
  });

  const titleInput = document.getElementById('titleInput');
  if(titleInput){
    titleInput.oninput = (e)=>{ formationTitle = e.target.value; };
  }

  document.querySelectorAll('.preset').forEach(el=>{
    el.onclick = ()=>{ selectedPreset = el.getAttribute('data-preset'); render(); };
  });

  document.querySelectorAll('[data-rowinc]').forEach(el=>{
    el.onclick = ()=>{ const i=+el.getAttribute('data-rowinc'); customRows[i]=Math.min(14, customRows[i]+1); render(); };
  });
  document.querySelectorAll('[data-rowdec]').forEach(el=>{
    el.onclick = ()=>{ const i=+el.getAttribute('data-rowdec'); customRows[i]=Math.max(1, customRows[i]-1); render(); };
  });
  document.querySelectorAll('[data-rowdel]').forEach(el=>{
    el.onclick = ()=>{
      if(customRows.length<=1) return;
      const i=+el.getAttribute('data-rowdel');
      customRows.splice(i,1); render();
    };
  });
  const btnAddRow = document.getElementById('btnAddRow');
  if(btnAddRow) btnAddRow.onclick = ()=>{ if(customRows.length<6){ customRows.push(3); render(); } };

  const btnBuild = document.getElementById('btnBuild');
  if(btnBuild) btnBuild.onclick = ()=>{
    const preset = PRESETS.find(p=>p.key===selectedPreset);
    rowsConfig = selectedPreset==='custom' ? customRows.slice() : preset.rows.slice();
    buildStageFromRows(rowsConfig);
    selected = null;
    screen = 'stage';
    render();
  };

  // stage screen
  document.querySelectorAll('.m-chip').forEach(el=>{
    el.onclick = ()=>{
      const num = +el.getAttribute('data-mnum');
      if(selected===num){ selected=null; render(); return; }
      selected = num;
      render();
    };
  });

  document.querySelectorAll('.slot').forEach(el=>{
    el.onclick = ()=>{
      const r = +el.getAttribute('data-row');
      const c = +el.getAttribute('data-col');
      const current = stage[r][c];
      if(current!==null){
        // pick up
        stage[r][c] = null;
        selected = current;
        render();
        return;
      }
      if(selected!==null){
        stage[r][c] = selected;
        selected = null;
        render();
      }
    };
  });

  const btnReset = document.getElementById('btnReset');
  if(btnReset) btnReset.onclick = ()=>{
    const has = placedNums().size>0;
    if(has && !confirm('配置をすべて空に戻します。よろしいですか？')) return;
    buildStageFromRows(rowsConfig);
    selected = null;
    render();
  };

  const btnBack = document.getElementById('btnBack');
  if(btnBack) btnBack.onclick = ()=>{
    const has = placedNums().size>0;
    if(has && !confirm('隊形を変更すると、今の配置はリセットされます。よろしいですか？')) return;
    screen = 'setup';
    render();
  };

  const btnSave = document.getElementById('btnSave');
  if(btnSave) btnSave.onclick = saveImage;
}

function saveImage(){
  const target = document.getElementById('stageCapture');
  if(!window.html2canvas){ alert('画像保存の準備中です。数秒後にもう一度お試しください。'); return; }
  html2canvas(target, { backgroundColor:'#0A0912', scale:2 }).then(canvas=>{
    const link = document.createElement('a');
    link.download = (formationTitle || 'inoi-joy-formation') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

/* ---------------- init ---------------- */
render();
</script>
</body>
</html>
